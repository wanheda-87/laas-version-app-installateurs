name: Construire les installateurs LaaS

# Un seul depôt public : les vrais binaires sont compilés par GitHub, puis
# publiés dans une Release téléchargeable. Aucun secret n'est nécessaire.
# L'interface réelle est embarquée dans l'application, elle-même embarquée
# dans l'installateur : aucun serveur, aucun port, aucun appel réseau au runtime.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows — setup.exe avec l'application
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer PyInstaller et PySide6
        run: py -m pip install pyinstaller PySide6==6.12.0
      - name: Vérifier les sources sans donnée ni secret
        shell: pwsh
        run: |
          $interdits = @('*.sqlite', '*.sqlite3', '*.db', '*.wal', '*.shm', 'library-id.json', 'laas.local.json')
          foreach ($motif in $interdits) {
            $trouve = Get-ChildItem -Recurse -File -Filter $motif -ErrorAction SilentlyContinue
            if ($trouve) { throw "Fichier interdit versionné : $motif" }
          }
      - name: Compiler la vraie application
        run: >
          py -m PyInstaller --noconfirm --onefile --noconsole
          --name laas-version-app --distpath build-app --workpath build-app-work
          --specpath build-app-spec --paths "$env:GITHUB_WORKSPACE\app"
          --add-data "$env:GITHUB_WORKSPACE\app\web;web" app\laas_app.py
      - name: Vérifier l'application Windows
        shell: pwsh
        run: |
          $file = "build-app/laas-version-app.exe"
          if (-not (Test-Path $file)) { throw "Application absente" }
          $bytes = [System.IO.File]::ReadAllBytes($file)[0..1]
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw "En-tête PE invalide" }
          Get-Item $file | Select-Object Name, Length
      - name: Compiler le vrai setup.exe avec l'application embarquée
        working-directory: installer
        run: >
          py -m PyInstaller --noconfirm --onefile --noconsole --name setup
          --add-binary "$env:GITHUB_WORKSPACE\build-app\laas-version-app.exe;app" setup.py
      - name: Vérifier le binaire
        working-directory: installer
        shell: pwsh
        run: |
          $file = "dist/setup.exe"
          if (-not (Test-Path $file)) { throw "setup.exe absent" }
          $bytes = [System.IO.File]::ReadAllBytes($file)[0..1]
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw "En-tête PE invalide" }
          Get-Item $file | Select-Object Name, Length
      - name: Essai d'installation réel en clics (sans raccourci sur le runner)
        shell: pwsh
        run: |
          $data = Join-Path $env:RUNNER_TEMP 'laas-donnees-essai'
          $app = Join-Path $env:RUNNER_TEMP 'laas-app-essai'
          Remove-Item -Recurse -Force $data,$app -ErrorAction SilentlyContinue
          & "installer/dist/setup.exe" --headless --data-dir $data --app-dir $app `
            --account "lecteur@example.invalid:motdepasse-long-1" --no-shortcut
          if (-not (Test-Path (Join-Path $app 'app\laas-version-app.exe'))) {
            throw "L'application n'a pas été installée"
          }
          if (-not (Test-Path (Join-Path $env:APPDATA 'laas-version-app\paths.json'))) {
            throw "La configuration du dossier de données n'a pas été écrite"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: installer/dist/setup.exe
          if-no-files-found: error
          retention-days: 7

  linux:
    name: Linux — binaire, application et AppImage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer Python, Tkinter et PyInstaller
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y python3 python3-tk python3-pip file
          python3 -m pip install --user pyinstaller PySide6==6.12.0
      - name: Aucune donnée ni secret dans les sources
        run: |
          set -eu
          if find . -type f \( -name '*.sqlite' -o -name '*.sqlite3' -o -name '*.db' \
              -o -name '*.wal' -o -name '*.shm' -o -name 'library-id.json' \
              -o -name 'laas.local.json' \) | grep .; then
            echo "Fichier interdit versionné" >&2
            exit 1
          fi
      - name: Compiler la vraie application
        run: |
          set -eu
          python3 -m PyInstaller --noconfirm --onefile --name laas-version-app \
            --distpath build-app --workpath build-app-work --specpath build-app-spec \
            --paths "$GITHUB_WORKSPACE/app" \
            --add-data "$GITHUB_WORKSPACE/app/web:web" app/laas_app.py
          file build-app/laas-version-app | grep -q ELF
      - name: Compiler le binaire d'installation avec l'application embarquée
        working-directory: installer
        run: |
          set -eu
          python3 -m PyInstaller --noconfirm --onefile --name setup \
            --add-binary "$GITHUB_WORKSPACE/build-app/laas-version-app:app" setup.py
          file dist/setup | grep -q ELF
      - name: Essai d'installation réel en clics
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}/laas-config-essai
        run: |
          set -eu
          data="$RUNNER_TEMP/laas-donnees-essai"
          app="$RUNNER_TEMP/laas-app-essai"
          rm -rf "$data" "$app" "$XDG_CONFIG_HOME"
          installer/dist/setup --headless --data-dir "$data" --app-dir "$app" \
            --account "lecteur@example.invalid:motdepasse-long-1" --no-shortcut
          test -x "$app/app/laas-version-app"
          test -f "$XDG_CONFIG_HOME/laas-version-app/paths.json"
          test ! -e "$app/Lancer LaaS Version App.bat"
      - name: Construire l'AppImage (installateur puis application au premier clic)
        run: |
          set -eu
          APPDIR="LaaS-Version-App-x86_64.AppDir"
          mkdir -p "$APPDIR/usr/bin" \
                   "$APPDIR/usr/share/applications" \
                   "$APPDIR/usr/share/icons/hicolor/256x256/apps"
          cp installer/dist/setup "$APPDIR/usr/bin/laas-version-app-setup"
          cp build-app/laas-version-app "$APPDIR/usr/bin/laas-version-app"
          cp assets/laas-icon.png \
             "$APPDIR/usr/share/icons/hicolor/256x256/apps/laas-version-app.png"
          # appimagetool cherche aussi l'icone a la racine de l'AppDir.
          cp assets/laas-icon.png "$APPDIR/laas-version-app.png"
          cp installer/laas-version-app.desktop \
             "$APPDIR/usr/share/applications/laas-version-app.desktop"
          cp installer/laas-version-app.desktop "$APPDIR/laas-version-app.desktop"
          cat > "$APPDIR/AppRun" <<'EOF'
          #!/bin/sh
          set -eu
          APPDIR="$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)"
          CONFIG="${XDG_CONFIG_HOME:-$HOME/.config}/laas-version-app/paths.json"
          if [ ! -f "$CONFIG" ]; then
            "$APPDIR/usr/bin/laas-version-app-setup" "$@" || exit 1
          fi
          # WebEngine ne peut pas activer son bac a sable dans une AppImage.
          QTWEBENGINE_DISABLE_SANDBOX=1
          export QTWEBENGINE_DISABLE_SANDBOX
          exec "$APPDIR/usr/bin/laas-version-app" "$@"
          EOF
          chmod +x "$APPDIR/AppRun" "$APPDIR/usr/bin/laas-version-app" \
                   "$APPDIR/usr/bin/laas-version-app-setup"
          curl -fsSL -o appimagetool.AppImage \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool.AppImage
          ./appimagetool.AppImage --appimage-extract-and-run "$APPDIR" \
            LaaS-Version-App-x86_64.AppImage
          test -s LaaS-Version-App-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            installer/dist/setup
            LaaS-Version-App-x86_64.AppImage
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publication des téléchargements
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Préparer les fichiers et les empreintes
        run: |
          set -eu
          mkdir -p a-publier
          cp artifacts/windows/setup.exe a-publier/setup.exe
          cp artifacts/linux/installer/dist/setup a-publier/setup-linux
          cp artifacts/linux/LaaS-Version-App-x86_64.AppImage a-publier/
          cd a-publier
          sha256sum setup.exe setup-linux LaaS-Version-App-x86_64.AppImage > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Créer ou remplacer la Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          tag="$GITHUB_REF_NAME"
          if [ "$tag" = "main" ]; then tag="latest"; fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes
          fi
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --title "LaaS version app — installateurs ($tag)" \
            --notes-file RELEASE-NOTES.md \
            a-publier/setup.exe \
            a-publier/setup-linux \
            a-publier/LaaS-Version-App-x86_64.AppImage \
            a-publier/SHA256SUMS.txt
